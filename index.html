<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShopPOS Pro" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <title>ShopPOS Pro</title>
    <meta name="description" content="An advanced, mobile-responsive point-of-sale system featuring sale billing, stock tracking, barcode/camera scanner simulation, report analytics, customer credit ledger, staff management, and expense logs." />
    <meta property="og:title" content="ShopPOS Pro" />
    <meta property="og:description" content="An advanced, mobile-responsive point-of-sale system featuring sale billing, stock tracking, barcode/camera scanner simulation, report analytics, customer credit ledger, staff management, and expense logs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var savedTheme = localStorage.getItem('shoppos_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
