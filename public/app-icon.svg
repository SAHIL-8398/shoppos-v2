<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#primaryGlow)" stroke-width="3.5" stroke-opacity="0.4" />

  <!-- Ambient Glowing Radial Circle -->
  <circle cx="256" cy="240" r="180" fill="#6366f1" opacity="0.12" filter="blur(40px)" />

  <!-- Modern Retail Terminal / Register Illustration -->
  <g filter="url(#shadowGlow)" transform="translate(256, 250)">
    <!-- Terminal Screen Base -->
    <rect x="-140" y="-130" width="280" height="190" rx="28" fill="url(#cardGrad)" stroke="url(#primaryGlow)" stroke-width="4" />
    
    <!-- Inner Screen Display -->
    <rect x="-122" y="-112" width="244" height="154" rx="18" fill="#090d16" />

    <!-- Screen Header Accent Line -->
    <rect x="-105" y="-95" width="60" height="10" rx="5" fill="#6366f1" />
    <rect x="-35" y="-95" width="24" height="10" rx="5" fill="#10b981" />
    
    <!-- Screen Cart Items Lines -->
    <rect x="-105" y="-70" width="130" height="8" rx="4" fill="#334155" />
    <rect x="55" y="-70" width="50" height="8" rx="4" fill="#818cf8" />

    <rect x="-105" y="-50" width="110" height="8" rx="4" fill="#334155" />
    <rect x="65" y="-50" width="40" height="8" rx="4" fill="#818cf8" />

    <rect x="-105" y="-30" width="90" height="8" rx="4" fill="#334155" />
    <rect x="75" y="-30" width="30" height="8" rx="4" fill="#818cf8" />

    <!-- Total Display Box -->
    <rect x="-105" y="-5" width="210" height="34" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="-90" y="18" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">TOTAL</text>
    <text x="85" y="20" text-anchor="end" fill="#34d399" font-family="system-ui, sans-serif" font-size="19" font-weight="900">₹ 1,450.00</text>

    <!-- Stand Neck -->
    <path d="M -40,60 L 40,60 L 60,115 L -60,115 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Stand Pedestal Base -->
    <rect x="-100" y="115" width="200" height="24" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />

    <!-- Payment Contactless Wave / Fast Checkout Icon Badge -->
    <g transform="translate(95, -115)">
      <circle cx="0" cy="0" r="34" fill="url(#accentEmerald)" stroke="#ffffff" stroke-width="3" />
      <!-- Lightning Bolt / Fast Checkout -->
      <path d="M 3,-18 L -14,-1 L -2,-1 L -5,18 L 14,0 L 2,0 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
